services:
  - type: web
    name: nxtwave-referral-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_simulation.py && gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT
    envVars:
      - key: ADMIN_KEY
        value: growth500
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
